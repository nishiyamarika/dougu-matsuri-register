const u=b=>Uint8Array.from(atob(b),x=>x.charCodeAt(0));
async function open_(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));return new TextDecoder().decode(pt)}
function show(h){document.open();document.write(h);document.close()}
const K="nsm_dm_pw";let saved=null;try{saved=localStorage.getItem(K)}catch(e){}
(async()=>{
 if(saved){try{show(await open_(saved));return}catch(e){try{localStorage.removeItem(K)}catch(_){}}}
 const f=document.getElementById("f");f.hidden=false;document.getElementById("pw").focus();
 f.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;const m=document.getElementById("msg");m.textContent="確認中…";
  try{const h=await open_(pw);try{localStorage.setItem(K,pw)}catch(_){}show(h)}catch(err){m.textContent="パスワードが違います"}};
})();
